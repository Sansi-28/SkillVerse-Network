# Server Port
server.port=${PORT:8080}

# Database Connection (H2 in-memory with PostgreSQL mode for local dev, or external DB_URL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:skillverse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Configuration (Enabled when running against production PostgreSQL)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Redis Configuration (Optional)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Sentry Configuration
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=1.0

# Security Configuration
jwt.secret=${JWT_SECRET:VGhpc0lzTXlTdXBlckxvbmdBbmRWZXJ5U2VjdXJlU2VjcmV0S2V5Rm9yTXlTa2lsbEV4Y2hhbmdlQXBwbGljYXRpb24xMjM0NTY3ODkw}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# Actuator Settings
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.redis.enabled=false
