# Server Port
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# --- PostgreSQL Database Settings (for production) ---
# To use for production, comment out the H2 section above and uncomment this section.
# You will also need to set the environment variables (JDBC_DATABASE_URL, etc.) in your deployment environment.
#spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/skillverse}
#spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
#spring.datasource.password=${JDBC_DATABASE_PASSWORD:password}
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA settings
# Validate schema in production, migrations are handled by Flyway.
spring.jpa.hibernate.ddl-auto=validate
# Set to false in production for cleaner logs
spring.jpa.show-sql=false

# --- Flyway Configuration ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- Redis Configuration ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Sentry Configuration ---
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=1.0
# --- Security Configuration ---
# IMPORTANT: Use environment variables for secrets in a real application.
jwt.secret=${JWT_SECRET:VGhpc0lzTXlTdXBlckxvbmdBbmRWZXJ5U2VjdXJlU2VjcmV0S2V5Rm9yTXlTa2lsbEV4Y2hhbmdlQXBwbGljYXRpb24xMjM0NTY3ODkw}

# JWT Expiration time in milliseconds
# 86400000 ms = 24 hours
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# --- Actuator Settings ---
# Expose health and info endpoints over the web
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized